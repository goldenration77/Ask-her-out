<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff0f5" />
    <title>A little question for you</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas class="love-canvas" aria-hidden="true"></canvas>
    <button class="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on">♫ Sound off</button>
    <main class="container">
      <div class="hero-art" aria-hidden="true"><span class="hero-heart">♥</span><span class="sparkle sparkle-one">✦</span><span class="sparkle sparkle-two">♡</span></div>
      <p class="eyebrow">A tiny question, a big feeling</p>
      <h1>Will you be my forever? <span class="infinity">∞</span><br /><span data-name="recipient">[Recipient Name]</span> 🤗</h1>
      <p class="byline">By, <span data-name="sender">[Your Name]</span>.</p>
      <div class="btn">
        <a class="button button-yes" href="yes.html">Yes <span aria-hidden="true">♥</span></a>
        <a class="button button-no" href="no1.html">No</a>
      </div>
      <p class="hint">Choose your answer ✨</p>
    </main>
    <script src="./config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
