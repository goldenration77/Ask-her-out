    <title>That means a lot · A little question</title>

  <body class="celebration">
    <canvas class="love-canvas" aria-hidden="true"></canvas>
    <button class="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on">♫ Sound off</button>
    <main class="container">
      <div class="hero-art celebration-art" aria-hidden="true"><span class="hero-heart">♥</span><span class="sparkle sparkle-one">✦</span><span class="sparkle sparkle-two">♡</span></div>
      <p class="eyebrow">A moment worth celebrating</p>
      <h1>That makes me so happy!</h1>
      <p class="byline">Thank you for saying yes. I can't wait to make a lovely memory together. Let's plan something that's fun for both of us.</p>
      <p class="hint">With excitement, <span data-name="sender">[Your Name]</span></p>
      <a class="button button-yes" href="index.html">Read the note again <span aria-hidden="true">♥</span></a>
    </main>
    <script src="./config.js"></script>
    <script src="./script.js"></script>
